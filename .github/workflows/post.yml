name: Post to Instagram

on:
  schedule:
    # GitHub cron is always UTC. These are about 8am, 12:30pm and 8pm Central
    # during daylight time (an hour earlier in local time from November to March).
    # Minutes are off the hour on purpose, because GitHub delays jobs scheduled at :00.
    - cron: '52 12 * * *'
    - cron: '22 17 * * *'
    - cron: '52 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft only (do not post to Instagram)'
        type: boolean
        default: true
      pillar:
        description: 'Pillar for this post'
        type: choice
        options: [auto, sweet, funny, spicy, motivational]
        default: auto
      photo:
        description: 'Make it a photo post (needs UNSPLASH_ACCESS_KEY)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      # Manual runs follow the dry_run checkbox.
      # Scheduled runs only post for real when the repo variable AUTO_POST is 'true'.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true || github.event_name != 'workflow_dispatch' && vars.AUTO_POST != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install brand fonts (Fraunces, DM Sans)
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f > /dev/null
          fc-list | grep -Ei "fraunces|dm sans"

      - name: Install dependencies
        run: npm install

      - name: Generate post (quote + image)
        run: node generate.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PILLAR: ${{ inputs.pillar || 'auto' }}
          FORCE_PHOTO: ${{ inputs.photo == true && 'true' || 'false' }}

      - name: Commit image so Instagram can fetch it
        run: |
          if [ "$DRY_RUN" = "true" ]; then DIR=drafts; else DIR=images; fi
          git config user.name "love-mostly-bot"
          git config user.email "love-mostly-bot@users.noreply.github.com"
          git add "$DIR"
          git commit -m "Add $DIR image" || echo "Nothing to commit"
          git pull --rebase
          git push

      - name: Publish (or preview if dry run)
        run: node publish.js
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

      - name: Save post history
        if: env.DRY_RUN != 'true'
        run: |
          git add history.json
          git commit -m "Log published post" || echo "Nothing to commit"
          git pull --rebase
          git push
